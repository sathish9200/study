<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <h1>Choose the car brand.</h1>
    <p>1.VW<br/>
    2.Skoda<br/>
    3.BMW<br/>
    4.Maruthi</p>
    <script>
        let car = prompt("Enter number from 1-4")

        switch(car){
            case "1":
            //case "11":
                console.log("VW");
                break;
            case "2":
            //case "22":
                console.log("Skoda");
                break;
            case "3":
            //case "33":
                console.log("BMW");
                break;
            case "4":
            //case "44":
                console.log("Maruthi");
                break;
        }
    </script>
</body>
</html>
